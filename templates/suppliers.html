<!DOCTYPE html>
<html>
<head>
    <title>Suppliers</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
    <div class="logo">📦 StockFlow</div>
</nav>

<div class="dashboard">

    <h1>Suppliers</h1>

    <a href="/add-supplier">
        <button class="btn">+ Add Supplier</button>
    </a>

    <table class="product-table">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Company</th>
            <th>Phone</th>
        </tr>

        {% for supplier in suppliers %}

        <tr>
            <td>{{ supplier.id }}</td>
            <td>{{ supplier.name }}</td>
            <td>{{ supplier.company }}</td>
            <td>{{ supplier.phone }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
